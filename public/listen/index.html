<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>House of Dreams — Exhibition Audio</title>
<meta name="description" content="Recorded readings from the prison writings of Ahed Sheikh Hassan — exhibition audio guide for House of Dreams.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.houseofdreams.space/listen/">
<meta property="og:title" content="House of Dreams — Listen">
<meta property="og:description" content="Exhibition audio guide — prison writings of Ahed Sheikh Hassan.">
<meta property="og:image" content="https://www.houseofdreams.space/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="House of Dreams — Listen">
<meta name="twitter:description" content="Exhibition audio guide — prison writings of Ahed Sheikh Hassan.">
<meta name="twitter:image" content="https://www.houseofdreams.space/og-image.png">

<!-- Favicon -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:#000}
body{
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:'Courier New',Courier,monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 24px;
  padding-top:max(env(safe-area-inset-top,0px),24px);
  padding-bottom:max(env(safe-area-inset-bottom,0px),24px);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* --- Fade-in animation --- */
@keyframes fadeSlideIn{
  from{opacity:0}
  to{opacity:1}
}
.reveal{opacity:0;animation:fadeSlideIn .4s ease-out forwards}
.reveal-d1{animation-delay:.15s}
.reveal-d2{animation-delay:.35s}
.reveal-d3{animation-delay:.55s}
.reveal-d4{animation-delay:.75s}
@media (prefers-reduced-motion:reduce){
.reveal{opacity:1;animation:none}
}

/* --- Header --- */
.header{
  text-align:center;
  padding:clamp(32px,8vh,56px) 0 0;
  width:100%;
  max-width:380px;
}
.kicker{
  font-size:.72rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:rgba(255,255,255,.68);
  margin-bottom:12px;
}
.title{
  font-size:clamp(1.6rem,4.5vw,2.2rem);
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:6px;
  line-height:1.2;
}

/* --- Paper ID --- */
.paper-id{
  text-align:center;
  padding:clamp(24px,5vh,40px) 0 0;
  width:100%;
  max-width:380px;
}
.paper-name-ar{
  font-size:clamp(1.2rem,3.5vw,1.6rem);
  line-height:1.4;
  margin-bottom:8px;
}
.paper-dates{
  font-size:.84rem;
  color:rgba(255,255,255,.56);
  letter-spacing:.06em;
  margin-bottom:8px;
}
.paper-label{
  font-size:.76rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:rgba(255,255,255,.68);
  margin-top:4px;
}
.paper-label[hidden]{display:none}
.paper-pos{
  font-size:.72rem;
  letter-spacing:.2em;
  color:rgba(255,255,255,.44);
  margin-top:8px;
}

/* --- Prev/next navigation --- */
.paper-nav{
  width:100%;
  max-width:380px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:clamp(24px,4vh,36px) 0 0;
}
.nav-link{
  padding:10px 16px;
  border:1px solid rgba(255,255,255,.44);
  color:rgba(255,255,255,.78);
  text-decoration:none;
  font-size:.76rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:background .15s ease,color .15s ease;
}
.nav-link:hover,.nav-link:focus-visible{
  background:#fff;
  color:#000;
  border-color:#fff;
}

/* --- Language selector --- */
.lang-selector{
  display:flex;
  gap:12px;
  justify-content:center;
  padding:clamp(28px,5vh,44px) 0 0;
  width:100%;
  max-width:380px;
}
.lang-btn{
  flex:1;
  max-width:160px;
  min-height:52px;
  padding:14px 12px;
  background:transparent;
  color:#fff;
  border:1px solid rgba(255,255,255,.44);
  font-family:inherit;
  font-size:1rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.lang-btn:hover,.lang-btn:focus-visible{
  background:#fff;
  color:#000;
  border-color:#fff;
}
.lang-btn:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}
.lang-btn[aria-pressed="true"]{
  background:#fff;
  color:#000;
  border-color:#fff;
}
.lang-label{
  display:block;
  font-size:1rem;
  letter-spacing:.06em;
}
.lang-format{
  display:block;
  font-size:.7rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:rgba(255,255,255,.44);
  margin-top:4px;
}
.lang-btn:hover .lang-format,.lang-btn:focus-visible .lang-format,.lang-btn[aria-pressed="true"] .lang-format{
  color:rgba(0,0,0,.6);
}

/* --- Player --- */
.player{
  width:100%;
  max-width:380px;
  padding:clamp(28px,5vh,40px) 0 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}
.player[hidden]{display:none}

.play-btn{
  width:72px;
  height:72px;
  border:2px solid #fff;
  background:transparent;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .15s ease,color .15s ease;
  flex-shrink:0;
}
.play-btn:hover,.play-btn:focus-visible{
  background:#fff;
  color:#000;
}
.play-btn:focus-visible{
  outline:2px solid #fff;
  outline-offset:3px;
}
.play-btn:disabled{
  opacity:.4;
  cursor:default;
}
.play-btn svg{width:28px;height:28px;fill:currentColor}

.progress-wrap{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.progress-track{
  width:100%;
  height:3px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  padding:10px 0;
  margin:-10px 0;
  background-clip:content-box;
}
.progress-track:focus-visible{
  outline:2px solid #fff;
  outline-offset:4px;
}
.progress-fill{
  height:100%;
  background:rgba(255,255,255,.7);
  width:0%;
  transition:width .15s linear;
}
.time-display{
  display:flex;
  justify-content:space-between;
  font-size:.72rem;
  letter-spacing:.1em;
  color:rgba(255,255,255,.44);
}

/* --- Loading indicator --- */
.loading-indicator{
  font-size:.76rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.44);
  text-align:center;
}
.loading-indicator[hidden]{display:none}
@keyframes ellipsis{
  0%{content:''}
  25%{content:'.'}
  50%{content:'..'}
  75%{content:'...'}
}
.loading-indicator::after{
  content:'';
  animation:ellipsis 1.6s steps(1) infinite;
}
.loading-indicator.error-state-msg{animation:none}
.loading-indicator.error-state-msg::after{animation:none;content:''}

/* --- Error state --- */
.error-state{
  text-align:center;
  padding:clamp(32px,8vh,56px) 0;
  width:100%;
  max-width:380px;
}
.error-state .paper-number{
  font-size:clamp(2.4rem,7vw,3.6rem);
  font-weight:normal;
  line-height:1.1;
  color:rgba(255,255,255,.38);
  margin-bottom:16px;
}
.error-msg{
  font-size:.88rem;
  line-height:1.6;
  color:rgba(255,255,255,.56);
}
.retry-btn{
  margin-top:16px;
  padding:10px 20px;
  background:transparent;
  color:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.44);
  font-family:inherit;
  font-size:.76rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.retry-btn:hover,.retry-btn:focus-visible{
  background:#fff;
  color:#000;
  border-color:#fff;
}

/* --- Archive link --- */
.archive-link{
  display:block;
  text-align:center;
  margin-top:clamp(24px,4vh,36px);
  padding:12px;
  color:rgba(255,255,255,.38);
  text-decoration:none;
  font-size:.76rem;
  letter-spacing:.12em;
  transition:color .2s ease;
}
.archive-link:hover{color:rgba(255,255,255,.78)}

/* --- Footer --- */
.footer{
  margin-top:auto;
  padding:clamp(32px,6vh,48px) 0 8px;
  text-align:center;
  width:100%;
}
.footer-text{
  font-size:.68rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(255,255,255,.28);
}

/* --- Arabic typography --- */
:lang(ar),[lang="ar"]{
  font-family:'Noto Naskh Arabic','Geeza Pro','Traditional Arabic','Arabic Typesetting',serif;
  letter-spacing:0 !important;
  word-spacing:.05em;
}
:lang(ar) *,[lang="ar"] *{letter-spacing:0 !important}

/* --- Focus indicators (a11y) --- */
:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}
:focus:not(:focus-visible){outline:none}

/* --- Transcript pane --- */
.transcript-pane{
  width:100%;
  max-width:380px;
  padding:clamp(28px,5vh,40px) 0 0;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.transcript-pane[hidden]{display:none}
.transcript-scroll{
  max-height:min(54vh, 420px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to bottom, #000 85%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 85%, transparent 100%);
  padding-bottom:24px;
}
.transcript-scroll::-webkit-scrollbar{width:3px}
.transcript-scroll::-webkit-scrollbar-track{background:transparent}
.transcript-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
.transcript-text{
  font-family:'Courier New',Courier,monospace;
  font-size:.95rem;
  line-height:1.7;
  color:rgba(255,255,255,.88);
  text-align:left;
  white-space:pre-wrap;
  word-wrap:break-word;
}
.transcript-text p{
  margin-bottom:1.2em;
}
.transcript-text p:last-child{
  margin-bottom:0;
}

.noscript-msg{
  text-align:center;
  padding:48px 24px;
  color:rgba(255,255,255,.68);
  font-size:.92rem;
  line-height:1.7;
}
</style>
</head>
<body>

<noscript>
  <div class="noscript-msg">
    <p>House of Dreams — Exhibition Audio Guide</p>
    <p>This page requires JavaScript to play audio.</p>
  </div>
</noscript>

<div id="app"></div>

<a href="/" class="archive-link reveal reveal-d4" lang="en">Explore the full archive &#8594;</a>

<footer class="footer reveal reveal-d4" lang="en">
  <p class="footer-text">houseofdreams.space</p>
</footer>

<script>
(function(){
  'use strict';

  var MIN_ID = 1;
  var MAX_ID = 13;
  var LANG_AR = 'ar';
  var LANG_EN = 'en';

  // Exhibition paper metadata — synced from scripts/exhibition-papers.js
  // When editing, update BOTH locations.
  var PAPERS = {
    1:  { archiveNum: 1,  ar: 'الورقة الأولى',              dates: '11/10/1988 \u2013 1/1/1990' },
    2:  { archiveNum: 2,  ar: 'الورقة الثانية',             dates: '12/1/1990 \u2013 17/1/1990' },
    3:  { archiveNum: 16, ar: 'الورقة السادسة عشر',         dates: '22/12/1991 \u2013 24/12/1991' },
    4:  { archiveNum: 17, ar: 'الورقة السابعة عشر',         dates: '25/12/1991 \u2013 27/12/1991' },
    5:  { archiveNum: 23, ar: 'الورقة الثالثة والعشرون',     dates: '15/1/1992 \u2013 16/1/1992' },
    6:  { archiveNum: 33, ar: 'الورقة الثالثة والثلاثون',    dates: '5/3/1992 \u2013 8/3/1992' },
    7:  { archiveNum: 34, ar: 'الورقة الرابعة والثلاثون',    dates: '8/3/1992 \u2013 11/3/1992' },
    8:  { archiveNum: 43, ar: 'الورقة الثالثة والأربعون',    dates: '19/5/1992 \u2013 27/5/1992' },
    9:  { archiveNum: 44, ar: 'الورقة الرابعة والأربعون',    dates: '27/5/1992 \u2013 15/6/1992' },
    10: { archiveNum: 45, ar: 'الورقة الخامسة والأربعون',    dates: '15/6/1992 \u2013 23/6/1992' },
    11: { archiveNum: 46, ar: 'الورقة السادسة والأربعون',    dates: '11/7/1992 \u2013 14/7/1992' },
    12: { archiveNum: 6,  ar: 'الورقة السادسة',              dates: '12/2/1991 \u2013 7/4/1991' },
    13: { archiveNum: 3,  ar: 'الورقة الثالثة',              dates: '19/7/1990 \u2013 8/9/1990' }
  };

  // Chronological order by diary start date — synced from
  // scripts/exhibition-papers.js (EXHIBITION_CHRONO_ORDER). Update BOTH.
  var CHRONO_ORDER = [1, 2, 13, 12, 3, 4, 5, 6, 7, 8, 9, 10, 11];

  var SVG_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

  // --- URL parsing ---
  function parsePaperId() {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('p');
    if (!raw) return null;
    var id = parseInt(raw, 10);
    if (isNaN(id) || id < MIN_ID || id > MAX_ID || String(id) !== raw) {
      return null;
    }
    return id;
  }

  function audioPath(id, lang) {
    return '/assets/listen/' + id + '_' + lang + '.mp3';
  }

  function transcriptPath(id) {
    return '/assets/listen/transcripts/' + id + '_en.txt';
  }

  function formatTime(sec) {
    if (!sec || !isFinite(sec)) return '0:00';
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function buildNav(id) {
    var idx = CHRONO_ORDER.indexOf(id);
    var prevId = idx > 0 ? CHRONO_ORDER[idx - 1] : null;
    var nextId = idx < CHRONO_ORDER.length - 1 ? CHRONO_ORDER[idx + 1] : null;
    var html = '<nav class="paper-nav reveal reveal-d4" dir="ltr" lang="en" aria-label="Paper navigation">';
    if (prevId) {
      html += '<a class="nav-link" id="nav-prev" data-id="' + prevId + '" href="?p=' + prevId + '" aria-label="Previous paper">&#8249; Prev</a>';
    } else {
      html += '<span></span>';
    }
    if (nextId) {
      html += '<a class="nav-link" id="nav-next" data-id="' + nextId + '" href="?p=' + nextId + '" aria-label="Next paper">Next &#8250;</a>';
    }
    html += '</nav>';
    return html;
  }

  // --- Render ---
  var paperId = parsePaperId();
  var app = document.getElementById('app');

  if (!paperId) {
    renderError();
  } else {
    renderPlayer(paperId);
  }

  function renderError() {
    app.innerHTML =
      '<div class="error-state reveal" lang="en" role="alert">' +
        '<div class="paper-number">?</div>' +
        '<p class="error-msg">Paper not found.<br>Please scan the QR code again.</p>' +
      '</div>';
  }

  function renderPlayer(id) {
    var paper = PAPERS[id];
    app.innerHTML =
      '<header class="header reveal" lang="en">' +
        '<p class="kicker">Exhibition Audio Guide</p>' +
        '<h1 class="title">House of Dreams</h1>' +
      '</header>' +

      '<section class="paper-id reveal reveal-d1">' +
        '<div class="paper-name-ar" lang="ar" dir="rtl">' + paper.ar + '</div>' +
        '<div class="paper-dates" dir="ltr">' + paper.dates + '</div>' +
        '<p class="paper-label" id="paper-label" lang="en">Paper ' + paper.archiveNum + '</p>' +
        '<p class="paper-pos" lang="en"><span dir="ltr">' + (CHRONO_ORDER.indexOf(id) + 1) + ' / ' + CHRONO_ORDER.length + '</span></p>' +
      '</section>' +

      '<nav class="lang-selector reveal reveal-d2" role="radiogroup" aria-label="Language selection">' +
        '<button class="lang-btn" id="btn-ar" type="button" lang="ar" aria-pressed="false" aria-label="Arabic narration">' +
          '<span class="lang-label">\u0627\u0644\u0639\u0631\u0628\u064A\u0629</span>' +
          '<span class="lang-format">\u266A narration</span>' +
        '</button>' +
        '<button class="lang-btn" id="btn-en" type="button" lang="en" aria-pressed="false" aria-label="English transcript">' +
          '<span class="lang-label">English</span>' +
          '<span class="lang-format">transcript</span>' +
        '</button>' +
      '</nav>' +

      '<div class="player reveal reveal-d3" id="player" hidden>' +
        '<p class="loading-indicator" id="loading-msg" aria-live="polite" aria-atomic="true">Loading</p>' +
        '<button class="play-btn" id="play-btn" type="button" disabled aria-label="Play">' + SVG_PLAY + '</button>' +
        '<div class="progress-wrap">' +
          '<div class="progress-track" id="progress-track" role="slider" tabindex="0" aria-label="Audio position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 of 0:00">' +
            '<div class="progress-fill" id="progress-fill"></div>' +
          '</div>' +
          '<div class="time-display">' +
            '<span id="time-current">0:00</span>' +
            '<span id="time-duration">0:00</span>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="transcript-pane reveal reveal-d3" id="transcript-pane" hidden>' +
        '<p class="loading-indicator" id="transcript-loading" aria-live="polite" aria-atomic="true">Loading</p>' +
        '<div class="transcript-scroll" id="transcript-scroll">' +
          '<article class="transcript-text" id="transcript-text" role="article" lang="en"></article>' +
        '</div>' +
      '</div>' +

      buildNav(id);

    initAudio(id);
  }

  function initAudio(id) {
    var btnAr = document.getElementById('btn-ar');
    var btnEn = document.getElementById('btn-en');
    var paperLabel = document.getElementById('paper-label');
    var player = document.getElementById('player');
    var playBtn = document.getElementById('play-btn');
    var progressTrack = document.getElementById('progress-track');
    var progressFill = document.getElementById('progress-fill');
    var timeCurrent = document.getElementById('time-current');
    var timeDuration = document.getElementById('time-duration');
    var loadingMsg = document.getElementById('loading-msg');
    var transcriptPane = document.getElementById('transcript-pane');
    var transcriptLoading = document.getElementById('transcript-loading');
    var transcriptText = document.getElementById('transcript-text');
    var transcriptScroll = document.getElementById('transcript-scroll');
    var navPrev = document.getElementById('nav-prev');
    var navNext = document.getElementById('nav-next');

    function updateNavHrefs() {
      var suffix = currentLang ? '&lang=' + currentLang : '';
      if (navPrev) navPrev.href = '?p=' + navPrev.getAttribute('data-id') + suffix;
      if (navNext) navNext.href = '?p=' + navNext.getAttribute('data-id') + suffix;
    }

    var audio = new Audio();
    audio.preload = 'metadata';
    var currentLang = null;
    var isPlaying = false;
    var hasError = false;
    var raf = null;
    var transcriptCache = {};

    function resetAudioPlayer() {
      isPlaying = false;
      hasError = false;
      playBtn.innerHTML = SVG_PLAY;
      playBtn.setAttribute('aria-label', 'Play');
      playBtn.disabled = true;
      progressFill.style.width = '0%';
      timeCurrent.textContent = '0:00';
      timeDuration.textContent = '0:00';
      loadingMsg.hidden = false;
      loadingMsg.textContent = 'Loading';
      loadingMsg.classList.remove('error-state-msg');
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      audio.pause();
      // Remove stale retry button
      var oldRetry = document.getElementById('retry-btn');
      if (oldRetry) oldRetry.remove();
    }

    function showAudioPlayer(langId) {
      transcriptPane.hidden = true;
      player.hidden = false;
      resetAudioPlayer();
      audio.src = audioPath(langId, LANG_AR);
      audio.load();
    }

    function showTranscript(langId) {
      player.hidden = true;
      audio.pause();
      if (raf) { cancelAnimationFrame(raf); raf = null; }

      transcriptPane.hidden = false;
      transcriptText.innerHTML = '';
      transcriptScroll.scrollTop = 0;

      // Check cache first
      if (transcriptCache[langId]) {
        renderTranscriptText(transcriptCache[langId]);
        return;
      }

      // Show loading
      transcriptLoading.hidden = false;
      transcriptLoading.textContent = 'Loading';
      transcriptLoading.classList.remove('error-state-msg');

      fetch(transcriptPath(langId))
        .then(function(res) {
          if (!res.ok) throw new Error(res.status);
          var ct = res.headers.get('content-type') || '';
          if (ct.indexOf('text/html') !== -1) throw new Error('not-found');
          return res.text();
        })
        .then(function(text) {
          transcriptCache[langId] = text;
          renderTranscriptText(text);
        })
        .catch(function() {
          transcriptLoading.textContent = 'Transcript not yet available';
          transcriptLoading.hidden = false;
          transcriptLoading.classList.add('error-state-msg');
        });
    }

    function renderTranscriptText(text) {
      transcriptLoading.hidden = true;
      var paragraphs = text.split(/\n\n+/);
      var html = '';
      for (var i = 0; i < paragraphs.length; i++) {
        var p = paragraphs[i].trim();
        if (p) {
          html += '<p>' + escapeHtml(p) + '</p>';
        }
      }
      transcriptText.innerHTML = html;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function selectLang(lang) {
      if (currentLang === lang) return;
      currentLang = lang;
      updateNavHrefs();

      // Update button states
      btnAr.setAttribute('aria-pressed', lang === LANG_AR ? 'true' : 'false');
      btnEn.setAttribute('aria-pressed', lang === LANG_EN ? 'true' : 'false');

      // Update document direction for Arabic
      if (lang === LANG_AR) {
        document.documentElement.lang = 'ar';
        document.documentElement.dir = 'rtl';
        paperLabel.hidden = true;
        showAudioPlayer(id);
      } else {
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
        paperLabel.hidden = false;
        showTranscript(id);
      }
    }

    audio.addEventListener('loadedmetadata', function() {
      if (currentLang !== LANG_AR) return;
      timeDuration.textContent = formatTime(audio.duration);
      loadingMsg.hidden = true;
      playBtn.disabled = false;
    });

    audio.addEventListener('error', function() {
      if (currentLang !== LANG_AR) return;
      hasError = true;
      loadingMsg.textContent = 'Audio not yet available';
      loadingMsg.hidden = false;
      loadingMsg.classList.add('error-state-msg');
      playBtn.disabled = true;
      if (!document.getElementById('retry-btn')) {
        var btn = document.createElement('button');
        btn.id = 'retry-btn';
        btn.className = 'retry-btn';
        btn.type = 'button';
        btn.textContent = 'Try again';
        btn.addEventListener('click', function() {
          hasError = false;
          loadingMsg.textContent = 'Loading';
          loadingMsg.classList.remove('error-state-msg');
          loadingMsg.hidden = false;
          playBtn.disabled = true;
          btn.remove();
          audio.load();
        });
        loadingMsg.parentNode.insertBefore(btn, loadingMsg.nextSibling);
      }
    });

    audio.addEventListener('ended', function() {
      isPlaying = false;
      playBtn.innerHTML = SVG_PLAY;
      playBtn.setAttribute('aria-label', 'Play');
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    });

    function updateProgress() {
      if (!audio.duration) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
      progressTrack.setAttribute('aria-valuenow', Math.round(pct));
      progressTrack.setAttribute('aria-valuetext', formatTime(audio.currentTime) + ' of ' + formatTime(audio.duration));
      if (isPlaying) {
        raf = requestAnimationFrame(updateProgress);
      }
    }

    playBtn.addEventListener('click', function() {
      if (hasError || currentLang !== LANG_AR) return;
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playBtn.innerHTML = SVG_PLAY;
        playBtn.setAttribute('aria-label', 'Play');
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      } else {
        audio.play().then(function() {
          isPlaying = true;
          playBtn.innerHTML = SVG_PAUSE;
          playBtn.setAttribute('aria-label', 'Pause');
          raf = requestAnimationFrame(updateProgress);
        }).catch(function() {
          // Autoplay blocked — user must tap again
        });
      }
    });

    progressTrack.addEventListener('click', function(e) {
      if (!audio.duration) return;
      var rect = progressTrack.getBoundingClientRect();
      var ratio;
      if (document.documentElement.dir === 'rtl') {
        ratio = (rect.right - e.clientX) / rect.width;
      } else {
        ratio = (e.clientX - rect.left) / rect.width;
      }
      ratio = Math.max(0, Math.min(1, ratio));
      audio.currentTime = ratio * audio.duration;
      updateProgress();
    });

    var SEEK_STEP = 5;
    progressTrack.addEventListener('keydown', function(e) {
      if (!audio.duration) return;
      var isRtl = document.documentElement.dir === 'rtl';
      var fwd = isRtl ? 'ArrowLeft' : 'ArrowRight';
      var bwd = isRtl ? 'ArrowRight' : 'ArrowLeft';
      switch (e.key) {
        case fwd: case 'ArrowUp':
          e.preventDefault();
          audio.currentTime = Math.min(audio.duration, audio.currentTime + SEEK_STEP);
          break;
        case bwd: case 'ArrowDown':
          e.preventDefault();
          audio.currentTime = Math.max(0, audio.currentTime - SEEK_STEP);
          break;
        case 'Home':
          e.preventDefault();
          audio.currentTime = 0;
          break;
        case 'End':
          e.preventDefault();
          audio.currentTime = audio.duration;
          break;
        default: return;
      }
      updateProgress();
    });

    btnAr.addEventListener('click', function() { selectLang(LANG_AR); });
    btnEn.addEventListener('click', function() { selectLang(LANG_EN); });

    var urlLang = new URLSearchParams(window.location.search).get('lang');
    if (urlLang === LANG_AR || urlLang === LANG_EN) {
      selectLang(urlLang);
    }
  }
})();
</script>
</body>
</html>
