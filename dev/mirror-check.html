<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mirror Check — House of Dreams</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #ccc; font-family: monospace; padding: 16px; }
h1 { color: #d6bc7f; font-size: 18px; margin-bottom: 4px; }
.subtitle { color: #888; font-size: 12px; margin-bottom: 12px; }
.controls { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
button { background: #333; color: #d6bc7f; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font-family: monospace; }
button:hover { background: #444; }
#status { color: #888; margin-left: 12px; font-size: 12px; }
.row { display: flex; gap: 32px; margin-bottom: 16px; flex-wrap: wrap; }
.side-panel { flex: 1; min-width: 300px; }
.side-panel h2 { color: #d6bc7f; font-size: 14px; margin-bottom: 8px; }
.compare { display: flex; gap: 12px; align-items: flex-start; }
.compare > div { text-align: center; }
.compare label { display: block; color: #888; font-size: 11px; margin-bottom: 4px; }
canvas { border: 1px solid #444; display: block; background: #1a1a1a; }
img.scan { border: 1px solid #444; display: block; background: #1a1a1a; object-fit: contain; }
.info { margin-top: 8px; font-size: 11px; color: #666; }
</style>
</head>
<body>
<h1>Mirror Check Tool</h1>
<p class="subtitle">Extracts the embedded texture from each GLB side and displays it flat beside the scan image. If they match, no mirroring.</p>
<div class="controls">
  <button id="prev">&lt; Prev</button>
  <span id="letterLabel">Letter 1</span>
  <button id="next">Next &gt;</button>
  <span id="status">Loading...</span>
</div>
<div class="row">
  <div class="side-panel">
    <h2>FRONT</h2>
    <div class="compare">
      <div>
        <label>GLB embedded texture</label>
        <canvas id="frontCanvas" width="300" height="600"></canvas>
      </div>
      <div>
        <label>Scan image (ground truth)</label>
        <img id="frontScan" class="scan" width="300" height="600">
      </div>
    </div>
    <p class="info" id="frontInfo"></p>
  </div>
  <div class="side-panel">
    <h2>BACK</h2>
    <div class="compare">
      <div>
        <label>GLB embedded texture</label>
        <canvas id="backCanvas" width="300" height="600"></canvas>
      </div>
      <div>
        <label>Scan image (ground truth)</label>
        <img id="backScan" class="scan" width="300" height="600">
      </div>
    </div>
    <p class="info" id="backInfo"></p>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

const loader = new GLTFLoader();
const status = document.getElementById('status');
const letterLabel = document.getElementById('letterLabel');
const frontCanvas = document.getElementById('frontCanvas');
const backCanvas = document.getElementById('backCanvas');
const frontScan = document.getElementById('frontScan');
const backScan = document.getElementById('backScan');
const frontInfo = document.getElementById('frontInfo');
const backInfo = document.getElementById('backInfo');

let lettersData = [];
let currentIndex = 0;

const res = await fetch('/src/data/letters.json');
lettersData = await res.json();

document.getElementById('prev').addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; loadLetter(); } });
document.getElementById('next').addEventListener('click', () => { if (currentIndex < lettersData.length - 1) { currentIndex++; loadLetter(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; loadLetter(); }
  if (e.key === 'ArrowRight' && currentIndex < lettersData.length - 1) { currentIndex++; loadLetter(); }
});

/**
 * Extract the texture from a named mesh node and draw it flat onto a canvas.
 * This shows exactly what texture is embedded in the GLB, without any
 * 3D transforms, rotation, or UV mapping — just the raw image.
 */
function drawTextureToCanvas(canvas, model, nodeName) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Find the mesh
  let texture = null;
  let meshName = '';
  model.traverse((child) => {
    if (!child.isMesh || texture) return;
    if (child.name === nodeName || child.material?.name === `Material_${nodeName}`) {
      const map = child.material?.map;
      if (map && map.image) {
        texture = map;
        meshName = child.name;
      }
    }
  });

  if (!texture || !texture.image) {
    ctx.fillStyle = '#333';
    ctx.fillText(`No texture found for ${nodeName}`, 10, 30);
    return null;
  }

  const img = texture.image;
  // Draw the raw embedded image, scaled to fit the canvas
  const aspect = img.width / img.height;
  const canvasAspect = canvas.width / canvas.height;
  let drawW, drawH, drawX, drawY;
  if (aspect > canvasAspect) {
    drawW = canvas.width;
    drawH = canvas.width / aspect;
    drawX = 0;
    drawY = (canvas.height - drawH) / 2;
  } else {
    drawH = canvas.height;
    drawW = canvas.height * aspect;
    drawX = (canvas.width - drawW) / 2;
    drawY = 0;
  }
  ctx.drawImage(img, drawX, drawY, drawW, drawH);

  return { width: img.width, height: img.height, meshName };
}

async function loadLetter() {
  const data = lettersData[currentIndex];
  letterLabel.textContent = `Letter ${data.id} (${currentIndex + 1}/${lettersData.length})`;
  status.textContent = 'Loading...';
  frontInfo.textContent = '';
  backInfo.textContent = '';

  const frontPath = data.frontImage || `/assets/letters/${data.id}.jpg`;
  const backPath = data.backImage || `/assets/letters/${data.id}-${data.id}.jpg`;
  frontScan.src = frontPath;
  backScan.src = backPath;

  try {
    const gltf = await new Promise((resolve, reject) => {
      loader.load(data.model, resolve, undefined, reject);
    });

    const model = gltf.scene;

    // Apply same material processing as letters.js so textures get SRGBColorSpace
    model.traverse((child) => {
      if (!child.isMesh || !child.material) return;
      const existingMap = child.material.map;
      if (existingMap) {
        existingMap.colorSpace = THREE.SRGBColorSpace;
        existingMap.needsUpdate = true;
      }
    });

    // Force a dummy render so textures get uploaded and image data is available
    const tmpRenderer = new THREE.WebGLRenderer({ canvas: document.createElement('canvas') });
    tmpRenderer.setSize(1, 1);
    const tmpScene = new THREE.Scene();
    tmpScene.add(model);
    const tmpCam = new THREE.PerspectiveCamera();
    tmpRenderer.render(tmpScene, tmpCam);

    const frontResult = drawTextureToCanvas(frontCanvas, model, 'Front');
    const backResult = drawTextureToCanvas(backCanvas, model, 'Back');

    tmpRenderer.dispose();

    if (frontResult) {
      frontInfo.textContent = `Mesh: ${frontResult.meshName} | Texture: ${frontResult.width}x${frontResult.height}px`;
    }
    if (backResult) {
      backInfo.textContent = `Mesh: ${backResult.meshName} | Texture: ${backResult.width}x${backResult.height}px`;
    }

    status.textContent = `Letter ${data.id} — if both columns look identical, the texture is not mirrored.`;

    // Dispose
    model.traverse((child) => {
      if (child.isMesh) {
        child.geometry?.dispose();
        child.material?.dispose();
      }
    });

  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    console.error(err);
  }
}

loadLetter();
</script>
</body>
</html>
